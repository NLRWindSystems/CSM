[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "csm"
dynamic = ["version"]
authors = [{ name = "Paul Crook", email = "paul.crook@nrel.gov" }]
readme = { file = "README.md", content-type = "text/markdown" }
description = "Wind Turbine Cost and Scaling Model Relationships"
requires-python = ">=3.12"
# license = { file = "LICENSE" }
dependencies = [
  "attrs>=23",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6",
  "networkx",
  "tqdm>=4",  # TODO: delete
  "openpyxl>=3",  # TODO: delete
]

[project.optional-dependencies]
develop = [
    "pre-commit>=2.20",
    "isort>=5.10",
    "pytest>=9",
    "pytest-cov>=4",
    "pytest-check",
    "ruff>=0.2",
    "ty",
    "jupyter-book<2",
    "sphinxcontrib-napoleon",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["csm"]
exclude = ["*.test", "*.test.*", "test.*", "test"]

[tool.setuptools.dynamic]
version = { attr = "csm.__version__" }

[tool.isort]
skip = []
multi_line_output = 3
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_third_party = ["attrs", "numpy", "pandas"]
known_first_party = "csm"
known_local_folder = "test"
combine_as_imports = true
force_grid_wrap = 0
include_trailing_comma = true
use_parentheses = true
length_sort = true
lines_after_imports = 2
line_length = 88


[tool.ruff]
src = ["csm", "tests"]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
# See https://github.com/charliermarsh/ruff#supported-rules
# for rules included and matching to prefix.
select = ["F", "E", "W", "C4", "D", "UP", "NPY", "PTH", "RUF", "FBT", "B", "PIE", "T20", "SIM", ]

# D205: not using summary lines and descriptions, just descriptions
# D401: don't believe enough in imperative mode to make all the changes currently
ignore = ["D205", "D401"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["F", "E", "W", "C4", "D", "UP", "NPY", "PTH", "RUF", "FBT", "B", "PIE", "T20", "SIM", ]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "examples/archival/*",
    "examples/*.ipynb"
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"



[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = [
    "csm/",
    "tests",
]
exclude = [
  "pyproject.toml"
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["E501", "D104", "F401"]
"test/*" = ["D100", "D101", "D102", "D103"]
"example/*.ipynb" = ["T201"]

[tool.coverage.run]
# Coverage.py configuration file
# https://coverage.readthedocs.io/en/latest/config.html
branch = true
source = ["csm/*"]
omit = [
  "*/test/*",
  "*/test_*.py"
]

[tool.pytest]
addopts = [
  "--strict-markers",
  "-r fEsxX",
  # "--cov=csm",
  # "--cov-report=term-missing"
]
tmp_path_retention_count = "1"
tmp_path_retention_policy = "failed"
cache_dir = ".cache"
markers = [
    "unit: marks unit tests (deselect with '-m \"not unit\"')",
    "regression: marks regression tests (deselect with '-m \"not regression\"')",
    "integration: marks unit tests (deselect with '-m \"not integration\"')",
]
